<style>
  :root{ --paper:#f2ebda; --acc:#8a6b2e; --gold:#e0a340; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#171512;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:9;background:#171512;
         border-bottom:1px solid #2e2a24;padding:10px 14px}
  .row{display:flex;align-items:baseline;gap:10px}
  h1{margin:0;font-size:15px;letter-spacing:.06em;color:var(--paper)}
  .at{margin-left:auto;font:12px/1 ui-monospace,Menlo,monospace;color:var(--gold);
      border:1px solid #4a4034;border-radius:4px;padding:4px 8px;white-space:nowrap}
  .sub{font-size:11px;color:#8b8377;margin-top:3px}
  nav{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  nav a{display:inline-block;min-width:28px;text-align:center;padding:5px 0;
        font:11px/1 ui-monospace,Menlo,monospace;text-decoration:none;color:#c9bfa4;
        border:1px solid #3a352d;border-radius:4px}
  nav a.on{background:var(--gold);color:#171512;border-color:var(--gold);font-weight:700}
  main{padding:14px}
  figure{margin:0 0 22px;scroll-margin-top:104px}
  img{width:100%;display:block;border-radius:3px;background:var(--paper);
      outline:2px solid transparent;transition:outline-color .25s}
  figure.on img{outline-color:var(--gold)}
  figcaption{font:11px/1.6 ui-monospace,Menlo,monospace;color:#6f6757;
             text-align:right;padding-top:6px}
  figure.on figcaption{color:var(--gold)}
  footer{padding:20px 14px 46px;color:#5d564c;font-size:11px;text-align:center}
  a.dl{color:var(--acc)}

<script>
(function(){
  var figs = Array.prototype.slice.call(document.querySelectorAll('figure'));
  var links = Array.prototype.slice.call(document.querySelectorAll('nav a'));
  var at = document.getElementById('at');
  var total = figs.length;
  var cur = 0;
  function mark(n){
    if(n === cur) return;
    cur = n;
    figs.forEach(function(f){ f.classList.toggle('on', +f.dataset.n === n); });
    links.forEach(function(a){ a.classList.toggle('on', +a.dataset.n === n); });
    at.textContent = 'page ' + n + ' / ' + total;
    document.title = 'p' + n + '/' + total + ' \u00b7 THE BRAIN BRAKE V2';
    var active = links.filter(function(a){ return +a.dataset.n === n; })[0];
    if(active && active.scrollIntoView) active.scrollIntoView({block:'nearest', inline:'center'});
    if(history.replaceState) history.replaceState(null, '', '#p' + n);
  }
  var io = new IntersectionObserver(function(entries){
    var best = null;
    entries.forEach(function(e){
      if(e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
    });
    if(best) mark(+best.target.dataset.n);
  }, {rootMargin:'-45% 0px -45% 0px', threshold:[0, .25, .5, 1]});
  figs.forEach(function(f){ io.observe(f); });
  mark(1);
})();
</script>
